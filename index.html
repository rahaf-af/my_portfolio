<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>my-portfolio</title>
  <style>
    #initial-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: #f4eefb;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #initial-loader .il-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(147, 3, 197, 0.2);
      border-top-color: #9303C5;
      border-radius: 50%;
      animation: il-spin 0.8s linear infinite;
    }

    @keyframes il-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="initial-loader">
    <div class="il-spinner"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
